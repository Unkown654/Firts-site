<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>After Password</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
        .login-container {
            text-align: center;
            margin-top: 2rem;
        }
        #proposeBtn {
            margin: 2rem auto 0 auto;
            padding: 1rem 2rem;
            font-size: 1.2rem;
            border-radius: 30px;
            border: none;
            background-color: #ff4081;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s ease;
            display: none;
        }
        #proposeBtn:hover {
            background-color: #e73370;
        }
    </style>
</head>
<body class="login-page">
    <div class="login-container">
        <button id="proposeBtn" style="display:none;">Before we Proceed Let me Ask you something</button>
    </div>

    <!-- Hearts for background -->
    <div class="heart" style="top: 20%; left: 10%; animation-delay: 0s;"></div>
    <div class="heart" style="top: 40%; left: 30%; animation-delay: 0.3s;"></div>
    <div class="heart" style="top: 60%; left: 50%; animation-delay: 0.6s;"></div>
    <div class="heart" style="top: 80%; left: 70%; animation-delay: 0.9s;"></div>
    <div class="heart" style="top: 30%; left: 80%; animation-delay: 1.2s;"></div>
    <div class="heart" style="top: 50%; left: 20%; animation-delay: 1.5s;"></div>
    <div class="heart" style="top: 70%; left: 40%; animation-delay: 1.8s;"></div>
    <div class="heart" style="top: 90%; left: 60%; animation-delay: 2.1s;"></div>

    <script>
        // Show the button after 2 seconds
        setTimeout(() => {
            const btn = document.getElementById('proposeBtn');
            btn.style.display = 'block';
        }, 2000);

        // Add click event to redirect to question.html
        document.getElementById('proposeBtn').addEventListener('click', function() {
            window.location.href = 'question.html';
        });
    </script>
</body>
</html>
